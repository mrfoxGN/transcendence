name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint without modifying files
        run: npm run lint -- --no-fix

      - name: Unit tests
        run: npm test -- --ci --runInBand

      - name: Build backend
        run: npm run build

      - name: Build production Docker image
        run: docker build --tag transcendence-backend:ci .

  migrations:
    name: Verify migrations on a fresh database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/backend
    # Disposable CI credentials, never Production credentials.
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: transcendence_ci
      DB_USER: ci_user
      DB_PASSWORD: ci_password
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: transcendence_ci
          MYSQL_USER: ci_user
          MYSQL_PASSWORD: ci_password
          MYSQL_ROOT_PASSWORD: ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysql --protocol=TCP -h 127.0.0.1 -uci_user -pci_password transcendence_ci -e 'SELECT 1'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=20s
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Apply production migrations
        run: npm run migration:run:prod

      - name: Verify migration discovery and completion
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const { AppDataSource: db } = require('./dist/database/data-source.js');
          (async () => {
            try {
              await db.initialize();
              assert.ok(db.migrations.length > 0, 'No compiled migrations discovered');
              assert.equal(await db.showMigrations(), false, 'Pending migrations remain');
              const rows = await db.query('SELECT COUNT(*) AS total FROM typeorm_migrations');
              assert.equal(Number(rows[0].total), db.migrations.length);
              await db.query('SELECT id FROM users LIMIT 1');
              assert.equal((await db.runMigrations()).length, 0, 'Second run must be a no-op');
              console.log(`PASS: ${db.migrations.length} migrations applied; users table readable; repeat run is a no-op`);
            } finally {
              if (db.isInitialized) await db.destroy();
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          JS
