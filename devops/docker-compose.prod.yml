# Localhost-only production deployment.
# Configure credentials in the root .env. Ports are fixed at 80, 443 and 8443.
name: transcendence-prod

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - database
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1'
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrate:
    image: ${BACKEND_IMAGE:-transcendence-backend:prod}
    build:
      context: ../apps/backend
      dockerfile: ../../devops/docker/backend.Dockerfile
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    command: ["npm", "run", "migration:run:prod"]
    restart: "no"
    networks:
      - database
    depends_on:
      mysql:
        condition: service_healthy

  backup:
    image: mysql:8.4
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-ec"]
    # Back up at startup, then daily at 03:00 in BACKUP_TZ.
    command:
      - |
        while true; do
          if /bin/bash /scripts/backup.sh; then
            next=$$(date -d 'tomorrow 03:00:00' +%s)
            echo "Next backup: $$(date -d "@$$next" '+%Y-%m-%d %H:%M:%S %Z')"
            sleep "$$((next - $$(date +%s)))"
          else
            echo 'Backup failed; retrying in 5 minutes.' >&2
            sleep 300
          fi
        done
    environment:
      DB_HOST: mysql
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      MYSQL_PWD: ${DB_PASSWORD}
      TZ: ${BACKUP_TZ:-Africa/Casablanca}
    volumes:
      - ../backups:/backups
      - ./scripts/backup.sh:/scripts/backup.sh:ro
    networks:
      - database
    depends_on:
      migrate:
        condition: service_completed_successfully

  backend:
    image: ${BACKEND_IMAGE:-transcendence-backend:prod}
    build:
      context: ../apps/backend
      dockerfile: ../../devops/docker/backend.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM}
      AUTH_PUBLIC_URL: ${AUTH_PUBLIC_URL}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_CALLBACK_URL: ${GITHUB_OAUTH_CALLBACK_URL:-}
      GITHUB_OAUTH_FRONTEND_URL: ${GITHUB_OAUTH_FRONTEND_URL:-}
      GITHUB_TOKEN_ENCRYPTION_KEY: ${GITHUB_TOKEN_ENCRYPTION_KEY:-}
    volumes:
      - backend_storage:/app/storage
    networks:
      - application
      - database
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/health', { signal: AbortSignal.timeout(3000) })
            .then(r => process.exit(r.status === 200 ? 0 : 1))
            .catch(() => process.exit(1));
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  status-page:
    image: twinproduction/gatus:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/status/config.yaml:/config/config.yaml:ro
    environment:
      GATUS_CONFIG_PATH: /config/config.yaml
    networks:
      - application
      - monitoring
      - database

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    restart: unless-stopped
    read_only: true
    command: ["--docker_only=true"]
    # These mounts are for rootful Docker. Rootless Docker uses different paths.
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  grafana:
    image: grafana/grafana:12.4.14
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: "https://localhost/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/default.yml:ro
      - ./monitoring/dashboards:/etc/grafana/dashboards:ro
    networks:
      - monitoring
      - application
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/grafana/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  cert-init:
    image: alpine:3.22
    restart: "no"
    volumes:
      - ./scripts/generate-certs.sh:/scripts/generate-certs.sh:ro
      - ./nginx/certs:/certs
    networks:
      - application
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        apk add --no-cache openssl
        exec /bin/sh /scripts/generate-certs.sh

  nginx:
    image: transcendence-nginx:prod
    build:
      context: ../apps/frontend
      dockerfile: ../../devops/docker/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
      - "127.0.0.1:8443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - application
    depends_on:
      cert-init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      grafana:
        condition: service_healthy
      status-page:
        condition: service_started

networks:
  application:
  database:
    internal: true
  monitoring:
    internal: true

volumes:
  mysql_data:
  backend_storage:
  prometheus_data:
  grafana_data:
