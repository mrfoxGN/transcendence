services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_NAME:-transcendence}
      MYSQL_USER: ${DB_USER:-transcendence}
      MYSQL_PASSWORD: ${DB_PASSWORD:-devup_local_db}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-devup_local_root}

    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysql --protocol=TCP -h 127.0.0.1
          -u "$$MYSQL_USER"
          --password="$$MYSQL_PASSWORD"
          --database="$$MYSQL_DATABASE"
          -e "SELECT 1" >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrate:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.dev


    env_file:
      - path: .env
        required: false

    environment: &database-environment
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-transcendence}
      DB_USER: ${DB_USER:-transcendence}
      DB_PASSWORD: ${DB_PASSWORD:-devup_local_db}

    command: npm run migration:run

    volumes:
      - ./apps/backend:/app
      - backend_node_modules:/app/node_modules

    depends_on:
      mysql:
        condition: service_healthy

    restart: "no"

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.dev

    restart: unless-stopped

    env_file:
      - path: .env
        required: false

    environment:
      <<: *database-environment
      APP_PORT: "3000"
      JWT_SECRET: ${JWT_SECRET:-devup-local-compose-only-change-before-deploying}
      AUTH_PUBLIC_URL: ${AUTH_PUBLIC_URL:-http://localhost:${FRONTEND_PORT:-8080}}
      GITHUB_OAUTH_FRONTEND_URL: ${GITHUB_OAUTH_FRONTEND_URL:-http://localhost:${FRONTEND_PORT:-8080}}

    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"

    volumes:
      - ./apps/backend:/app
      - backend_node_modules:/app/node_modules

    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exitCode = 1 }).catch(() => { process.exitCode = 1 })"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  frontend:
    build: ./apps/frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  backend_node_modules:
