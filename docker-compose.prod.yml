name: transcendence-prod

services:
  mysql:
    image: mysql:8.4
    mem_limit: 768m
    cpus: 1.0
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME is required}
      MYSQL_USER: ${DB_USER:?DB_USER is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - database

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysql --protocol=TCP -h 127.0.0.1
          -u "$$MYSQL_USER"
          --password="$$MYSQL_PASSWORD"
          --database="$$MYSQL_DATABASE"
          -e "SELECT 1" >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrate:
    image: ${BACKEND_IMAGE:-transcendence-backend:prod}
    mem_limit: 512m
    cpus: 1.0
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: ./apps/backend
      dockerfile: Dockerfile

    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

    command: ["npm", "run", "migration:run:prod"]
    restart: "no"

    networks:
      - database

    depends_on:
      mysql:
        condition: service_healthy

  backend:
    image: ${BACKEND_IMAGE:-transcendence-backend:prod}
    mem_limit: 512m
    cpus: 1.0
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: ./apps/backend
      dockerfile: Dockerfile

    restart: unless-stopped
    init: true

    environment:
      NODE_ENV: production
      APP_PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_CALLBACK_URL: ${GITHUB_OAUTH_CALLBACK_URL:-}
      GITHUB_TOKEN_ENCRYPTION_KEY: ${GITHUB_TOKEN_ENCRYPTION_KEY:-}

    volumes:
      - backend_storage:/app/storage

    networks:
      - application
      - database

    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const http = require('node:http');
          const request = http.get('http://127.0.0.1:3000/health', response => {
            response.resume();
            process.exit(response.statusCode === 200 ? 0 : 1);
          });
          request.setTimeout(3000, () => { request.destroy(); process.exit(1); });
          request.on('error', () => process.exit(1));
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  status-page:
    image: node:22-bookworm-slim@sha256:5ec23b7c622b00547753bc6ffd78085dd868a68aeb41c8e0a1418f033e13d96d
    restart: unless-stopped
    init: true
    user: "65534:65534"
    read_only: true
    command: ["node", "/app/server.mjs"]
    volumes:
      - ./monitoring/status:/app:ro
    networks:
      - application
      - monitoring
    mem_limit: 64m
    cpus: 0.25
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginxlog-exporter:
    image: quay.io/martinhelmich/prometheus-nginxlog-exporter:v1.11.0
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    command: ["-config-file", "/etc/nginxlog/config.yml"]
    volumes:
      - ./monitoring/nginxlog.yml:/etc/nginxlog/config.yml:ro
    networks:
      - monitoring
      - application
    mem_limit: 128m
    cpus: 0.5
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  docker-api-proxy:
    image: node:22-bookworm-slim@sha256:5ec23b7c622b00547753bc6ffd78085dd868a68aeb41c8e0a1418f033e13d96d
    restart: unless-stopped
    init: true
    user: "0:0"
    read_only: true
    command: ["node", "/app/docker-api-proxy.mjs"]
    volumes:
      - ./monitoring/docker-api-proxy.mjs:/app/docker-api-proxy.mjs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker_api
    mem_limit: 128m
    cpus: 0.5
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2375/_ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 6s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  docker-state-exporter:
    image: node:22-bookworm-slim@sha256:5ec23b7c622b00547753bc6ffd78085dd868a68aeb41c8e0a1418f033e13d96d
    restart: unless-stopped
    init: true
    read_only: true
    user: "65534:65534"
    command: ["node", "/app/docker-state-exporter.mjs"]
    environment:
      COMPOSE_PROJECT: transcendence-prod
      DOCKER_API_URL: http://docker-api-proxy:2375
    volumes:
      - ./monitoring/docker-state-exporter.mjs:/app/docker-state-exporter.mjs:ro
    depends_on:
      docker-api-proxy:
        condition: service_healthy
    networks:
      - monitoring
      - docker_api
    mem_limit: 64m
    cpus: 0.25
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.21.0
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?MYSQL_EXPORTER_PASSWORD is required}
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=monitoring_exporter
      - --config.my-cnf=/dev/null
      - --collect.global_status
      - --collect.global_variables
      - --no-collect.slave_status
      - --no-collect.info_schema.innodb_cmp
      - --no-collect.info_schema.innodb_cmpmem
      - --no-collect.info_schema.query_response_time
      - --exporter.query_timeout=3
      - --exporter.max_open_connections=2
    networks:
      - monitoring
      - database
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.5
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.29.1
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro
      - ./nginx/certs/fullchain.pem:/etc/blackbox/local-ca.pem:ro
    networks:
      - monitoring
      - application
    mem_limit: 128m
    cpus: 0.5
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    restart: unless-stopped
    read_only: true
    command:
      - --docker=tcp://docker-api-proxy:2375
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
      - --enable_metrics=cpu,memory,network,diskIO
    volumes:
      - /proc:/rootfs/proc:ro
      - /sys:/sys:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
    depends_on:
      docker-api-proxy:
        condition: service_healthy
    networks:
      - monitoring
      - docker_api
    mem_limit: 256m
    cpus: 0.5
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.meminfo
      - --collector.filesystem
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker|var/lib/containers)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    networks:
      - monitoring
    mem_limit: 128m
    cpus: 0.5
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=512MB
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring
    mem_limit: 256m
    cpus: 1.0
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  grafana:
    image: grafana/grafana:12.4.14
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: https://localhost/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/monitoring-overview.json
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY:?GRAFANA_SECRET_KEY is required}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/default.yml:ro
      - ./monitoring/dashboards:/etc/grafana/dashboards:ro
    networks:
      - monitoring
      - application
    depends_on:
      prometheus:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1.0
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/grafana/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  nginx:
    image: nginx:stable-alpine
    mem_limit: 128m
    cpus: 0.5
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

    networks:
      - application

    depends_on:
      backend:
        condition: service_healthy
      nginxlog-exporter:
        condition: service_started

    restart: unless-stopped

networks:
  docker_api:
    internal: true
  application:
  database:
    internal: true
  monitoring:
    internal: true

volumes:
  mysql_data:
  backend_storage:
  prometheus_data:
  grafana_data:
