    values: 1x30
  - series: docker_container_restart_count{job="docker-state",project="transcendence-prod",service="nginx",container_id="nginx-id"}
    values: '0x30'
  - series: docker_container_running{job="docker-state",project="transcendence-prod",service="prometheus",container_id="prometheus-id"}
    values: 1x30
  - series: docker_container_restart_count{job="docker-state",project="transcendence-prod",service="prometheus",container_id="prometheus-id"}
    values: '0x30'
  - series: docker_container_running{job="docker-state",project="transcendence-prod",service="grafana",container_id="grafana-id"}
    values: 1x30
  - series: docker_container_restart_count{job="docker-state",project="transcendence-prod",service="grafana",container_id="grafana-id"}
    values: '0x30'
  - series: docker_container_running{job="docker-state",project="transcendence-prod",service="node-exporter",container_id="node-exporter-id"}
    values: 1x30
  - series: docker_container_restart_count{job="docker-state",project="transcendence-prod",service="node-exporter",container_id="node-exporter-id"}
    values: '0x30'
  - series: docker_container_running{job="docker-state",project="transcendence-prod",service="cadvisor",container_id="cadvisor-id"}
    values: 1x30
  - series: docker_container_restart_count{job="docker-state",project="transcendence-prod",service="cadvisor",container_id="cadvisor-id"}
    values: '0x30'
  - series: docker_container_running{job="docker-state",project="transcendence-prod",service="blackbox-exporter",container_id="blackbox-exporter-id"}
