    values: 1x30
  - series: docker_container_restart_count{job="docker-state",project="transcendence-prod",service="docker-state-exporter",container_id="docker-state-exporter-id"}
    values: '0x30'
  - series: docker_container_running{job="docker-state",project="transcendence-prod",service="nginxlog-exporter",container_id="nginxlog-exporter-id"}
    values: 1x30
  - series: docker_container_restart_count{job="docker-state",project="transcendence-prod",service="nginxlog-exporter",container_id="nginxlog-exporter-id"}
