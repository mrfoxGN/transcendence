rule_files:
- /rules/alerts.yml
evaluation_interval: 15s
tests:
- name: healthy incl completed migrate
  interval: 1m
  input_series:
  - series: up{job="prometheus",instance="prometheus:test"}
    values: 1x30
  - series: up{job="node",instance="node:test"}
    values: 1x30
  - series: up{job="cadvisor",instance="cadvisor:test"}
    values: 1x30
  - series: up{job="blackbox-exporter",instance="blackbox-exporter:test"}
    values: 1x30
  - series: up{job="backend-https",instance="backend-https:test"}
    values: 1x30
  - series: up{job="mysql",instance="mysql:test"}
    values: 1x30
  - series: up{job="docker-state",instance="docker-state:test"}
    values: 1x30
  - series: up{job="nginxlog",instance="nginxlog:test"}
    values: 1x30
  - series: probe_success{job="backend-https",instance="https://nginx/health"}
    values: 1x30
  - series: mysql_up{job="mysql",instance="mysql:test"}
    values: 1x30
  - series: docker_state_up{job="docker-state",instance="docker:test"}
    values: 1x30
  - series: node_cpu_seconds_total{job="node",instance="host",mode="idle",cpu="0"}
    values: 0+30x30
