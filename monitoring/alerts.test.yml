  - series: docker_container_running{job="docker-state",project="transcendence-prod",service="migrate",container_id="migration-id"}
    values: '0x30'
  - series: docker_container_running{job="docker-state",project="transcendence-prod",service="status-page",container_id="status-page-id"}
    values: 1x30
  - series: docker_container_running{job="docker-state",project="transcendence-prod",service="docker-api-proxy",container_id="docker-api-proxy-id"}
    values: 1x30
  promql_expr_test:
  - expr: count(ALERTS) or vector(0)
    eval_time: 20m
    exp_samples:
    - labels: '{}'
      value: 0
