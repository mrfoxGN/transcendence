# Initial local thresholds; review against real workload before remote deployment.
groups:
- name: transcendence-production
  interval: 15s
  rules:
  - record: transcendence_monitoring_rules_loaded
    expr: vector(1)
  - record: transcendence_expected_container
    expr: label_replace(vector(1), "service", "backend", "", "") or label_replace(vector(1), "service", "mysql",
      "", "") or label_replace(vector(1), "service", "nginx", "", "") or label_replace(vector(1), "service", "prometheus",
      "", "") or label_replace(vector(1), "service", "grafana", "", "") or label_replace(vector(1), "service", "node-exporter",
      "", "") or label_replace(vector(1), "service", "cadvisor", "", "") or label_replace(vector(1), "service",
      "blackbox-exporter", "", "") or label_replace(vector(1), "service", "mysqld-exporter", "", "") or label_replace(vector(1),
      "service", "docker-state-exporter", "", "") or label_replace(vector(1), "service", "nginxlog-exporter", "",
      "") or label_replace(vector(1), "service", "status-page", "", "") or label_replace(vector(1), "service", "docker-api-proxy", "", "")
  - alert: MonitoringTargetDown
    expr: up{job=~"prometheus|node|cadvisor|blackbox-exporter|backend-https|mysql|docker-state|nginxlog"} == 0
    for: 1m
    labels:
      severity: critical
      scope: production
    annotations:
      summary: Monitoring target is unreachable
      description: Check the target container and Docker network. Missing measurements are not healthy results.
  - alert: MonitoringTargetMissing
    expr: absent(up{job="prometheus"}) or absent(up{job="node"}) or absent(up{job="cadvisor"}) or absent(up{job="blackbox-exporter"})
      or absent(up{job="backend-https"}) or absent(up{job="mysql"}) or absent(up{job="docker-state"}) or absent(up{job="nginxlog"})
    for: 1m
    labels:
      severity: critical
      scope: production
    annotations:
      summary: An expected monitoring target is missing
      description: Check scrape configuration and Prometheus target discovery.
  - alert: BackendHttpsUnavailable
    expr: probe_success{job="backend-https"} == 0 or absent(probe_success{job="backend-https"})
    for: 1m
    labels:
      severity: critical
      scope: production
    annotations:
      summary: Backend HTTPS health check failed
      description: Check Nginx, Backend, local TLS trust and /health. This does not test MySQL connectivity.
  - alert: MySQLUnavailable
    expr: mysql_up{job="mysql"} == 0 or absent(mysql_up{job="mysql"})
    for: 1m
    labels:
      severity: critical
      scope: production
    annotations:
      summary: MySQL monitoring connection failed
      description: Check MySQL and the dedicated monitoring account. Backend credentials are separate.
  - alert: DockerStateUnavailable
    expr: docker_state_up{job="docker-state"} == 0 or absent(docker_state_up{job="docker-state"})
    for: 1m
    labels:
      severity: critical
      scope: production
    annotations:
      summary: Docker state collection failed
      description: Check the state exporter and Docker socket access. Container status is unknown until collection
        recovers.
  - alert: ProductionContainerUnavailable
    expr: (transcendence_expected_container unless on(service) (max by(service) (docker_container_running{job="docker-state",project="transcendence-prod"})
      == 1)) and on() (docker_state_up{job="docker-state"} == 1)
    for: 1m
    labels:
      severity: critical
      scope: production
    annotations:
      summary: An expected Production container is stopped or missing
      description: Check the service named in the alert labels. Completed migrate is intentionally excluded.
  - alert: HostMetricsMissing
    expr: absent(node_cpu_seconds_total{job="node",mode="idle"}) or absent(node_memory_MemAvailable_bytes{job="node"})
      or absent(node_memory_MemTotal_bytes{job="node"}) or absent(node_filesystem_avail_bytes{job="node",mountpoint="/"})
      or absent(node_filesystem_size_bytes{job="node",mountpoint="/"})
    for: 2m
    labels:
      severity: warning
      scope: production
    annotations:
      summary: Required host metrics are missing
      description: Check Node Exporter collectors and read-only host mounts.
  - alert: HostCpuHigh
    expr: 100 * (1 - avg by(instance) (rate(node_cpu_seconds_total{job="node",mode="idle"}[5m]))) > 90
    for: 10m
    labels:
      severity: warning
      scope: production
    annotations:
      summary: Host CPU is above 90 percent
      description: Inspect host and container CPU panels. This is average non-idle CPU across all cores, including
        I/O wait.
  - alert: HostMemoryLow
    expr: node_memory_MemAvailable_bytes{job="node"} / node_memory_MemTotal_bytes{job="node"} < 0.10
    for: 5m
    labels:
      severity: warning
      scope: production
    annotations:
      summary: Host available RAM is below 10 percent
      description: Inspect memory consumers. MemAvailable includes reclaimable memory; swap is separate.
  - alert: RootDiskLow
    expr: node_filesystem_avail_bytes{job="node",mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{job="node",mountpoint="/",fstype!~"tmpfs|overlay"}
      < 0.10
    for: 5m
    labels:
      severity: warning
      scope: production
    annotations:
      summary: Root filesystem available space is below 10 percent
      description: Review disk use, logs, images and backups. Do not delete application volumes to free space.
  - alert: ContainerRestartBurst
    expr: (docker_container_restart_count{job="docker-state",project="transcendence-prod",service!="migrate"} -
      min_over_time(docker_container_restart_count{job="docker-state",project="transcendence-prod",service!="migrate"}[15m]))
      >= 3
    for: 1m
    labels:
      severity: warning
      scope: production
    annotations:
      summary: Docker RestartCount increased by at least three
      description: Observed increase within 15 minutes for the same container ID. Events before the first sample
        or between counter resets can be missed.
  - alert: MySQLConnectionsHigh
    expr: (mysql_global_status_threads_connected{job="mysql"} / mysql_global_variables_max_connections{job="mysql"}
      > 0.80) and on(instance) (mysql_up{job="mysql"} == 1)
    for: 5m
    labels:
      severity: warning
      scope: production
    annotations:
      summary: MySQL connections exceed 80 percent of its limit
      description: Inspect connections and application pooling. Monitoring and health-check connections are included.
  - alert: ApiServerErrorsHigh
    expr: (sum(rate(api_http_response_count_total{job="nginxlog",status=~"5.."}[5m])) / sum(rate(api_http_response_count_total{job="nginxlog"}[5m]))
      > 0.05) and (sum(increase(api_http_response_count_total{job="nginxlog"}[5m])) >= 20) and on() (up{job="nginxlog"}
      == 1)
    for: 2m
    labels:
      severity: warning
      scope: production
    annotations:
      summary: Observed API 5xx ratio is above 5 percent
      description: Requires at least 20 observed requests in five minutes. Excludes health/Grafana/Socket.IO. UDP
        delivery is best-effort.
  - alert: ApiLogParseErrors
    expr: increase(api_parse_errors_total{job="nginxlog"}[5m]) > 0
    for: 1m
    labels:
      severity: warning
      scope: production
    annotations:
      summary: API metrics log parsing failed
      description: Check that Nginx metrics format matches the exporter configuration. Zero parse errors does not
        guarantee UDP delivery.
  - alert: TlsCertificateExpiring
    expr: probe_ssl_earliest_cert_expiry{job="backend-https"} - time() < 14 * 86400
    for: 10m
    labels:
      severity: warning
      scope: production
    annotations:
      summary: Local HTTPS certificate expires within 14 days
      description: Renew the local certificate, update exporter trust if needed, reload Nginx and verify HTTPS probes.
  - alert: PrometheusRuleEvaluationErrors
    expr: increase(prometheus_rule_evaluation_failures_total{job="prometheus"}[5m]) > 0
    for: 1m
    labels:
      severity: critical
      scope: production
    annotations:
      summary: Prometheus rule evaluation errors occurred
      description: Check rule health and Prometheus logs. A stopped Prometheus cannot alert on its own outage.
