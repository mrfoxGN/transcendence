worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    proxy_hide_header X-Powered-By;

    # Only login requests share this per-client-IP bucket; other routes use no key.
    map $uri $login_limit_key {
        default "";
        ~*^/auth/login/?$ $binary_remote_addr;
    }
    limit_req_zone $login_limit_key zone=auth_login:10m rate=5r/m;

    # Log the path without query parameters or potentially sensitive headers.
    log_format app_access '$remote_addr [$time_iso8601] '
                          '"$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent '
                          'request_time=$request_time '
                          'upstream_time=$upstream_response_time';
    access_log /dev/stdout app_access;

    # Bounded labels and no client/path/header data in the metrics stream.
    map $request_method $metric_method {
        default OTHER;
        GET GET;
        HEAD HEAD;
        POST POST;
        PUT PUT;
        PATCH PATCH;
        DELETE DELETE;
        OPTIONS OPTIONS;
    }
    map $uri $is_api {
        default 1;
        /health 0;
        ~^/status(?:/|$) 0;
        ~^/grafana(?:/|$) 0;
        ~^/socket\.io(?:/|$) 0;
    }
    log_format api_metrics '"$metric_method / HTTP/1.1" $status $body_bytes_sent $request_time';

    # Socket.IO can upgrade an HTTP connection to WebSocket.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Allow a 10 MiB file plus multipart form overhead.
    client_max_body_size 11m;

    server {
        listen 80;
        server_name localhost;

        return 308 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        limit_req zone=auth_login burst=5 nodelay;
        limit_req_status 429;
        server_name localhost;

        # Preserve stdout logs; also send minimal API events to internal metrics.
        access_log /dev/stdout app_access;
        access_log syslog:server=nginxlog-exporter:5531,tag=api api_metrics if=$is_api;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        # Variable upstream allows startup even when the status service is down.
        location ~ ^/status(?:/|$) {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $status_upstream status-page:8080;
            proxy_pass http://$status_upstream$request_uri;
            proxy_connect_timeout 3s;
            proxy_read_timeout 8s;
        }

        location = /grafana {
            return 308 /grafana/;
        }

        location ^~ /grafana/ {
            # Resolve at request time so Grafana downtime does not block Nginx startup.
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $grafana_upstream grafana:3000;
            proxy_pass http://$grafana_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 75s;
        }

        location / {
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Socket.IO heartbeats keep active WebSocket connections alive.
            proxy_read_timeout 75s;
            proxy_send_timeout 75s;
        }
    }
}
